<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMEWORK</title>
    <style>
        body{
            background-color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>VINAYAK CALCULATOR</h1>
    <h4>Maths is the queen of science</h4>
    <h4>a = 10<br>b = 10</h4>
    <p id="add"></p>
    <p id="sub"></p>
    <p id="mul"></p>
    <p id="div"></p>
    <script>
        var num1 = 10;
        var num2 = 10;
        var add = num1 + num2 ;
        var sub = num1 - num2 ;
        var mul = num1 * num2 ;
        var div = num1 / num2 ;
        document.getElementById("add").innerHTML = "The added value is:" + add ;
        document.getElementById("sub").innerHTML = "The subtracted value is:" + sub ;
        document.getElementById("mul").innerHTML = "The multipied value is:" + mul ;
        document.getElementById("div").innerHTML = "The divided value is:" + div ;
    </script>
</body>
</html>
